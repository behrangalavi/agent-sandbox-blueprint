name: chart

on:
  pull_request:
    paths: ["helm/**", ".github/workflows/chart.yaml"]
  push:
    branches: [main]
    paths: ["helm/**", ".github/workflows/chart.yaml"]

permissions:
  contents: write # chart-releaser pushes the index to the gh-pages branch and creates releases

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/mogenius-agent-sandbox
      - name: render with default, GKE and multi-profile values
        run: |
          helm template t helm/mogenius-agent-sandbox -n agent-sandbox-system >/dev/null
          helm template t helm/mogenius-agent-sandbox -n agent-sandbox-system \
            --set sandboxes.runtimeClassName=gvisor \
            --set 'sandboxes.networkPolicy.additionalBlockedCidrs={34.118.224.0/20}' \
            --set sandboxes.profiles.opencode.enabled=true >/dev/null
      # A broken image string (whitespace, template leftovers) only shows up as
      # InvalidImageName at runtime; catch it here for every profile.
      - name: image references parse
        run: |
          set -euo pipefail
          helm template t helm/mogenius-agent-sandbox -n agent-sandbox-system \
            --set sandboxes.profiles.opencode.enabled=true \
            | grep -E '^[[:space:]]*image:' | sed -E 's/^[[:space:]]*image:[[:space:]]*//; s/"//g' | tee /tmp/images.txt
          ! grep -vE '^[a-z0-9]+([._-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)*(:[A-Za-z0-9._-]+)?(@sha256:[0-9a-f]{64})?$' /tmp/images.txt
      - name: CRDs match appVersion
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^appVersion:' helm/mogenius-agent-sandbox/Chart.yaml | awk '{print $2}')"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/upstream.yaml \
            "https://github.com/kubernetes-sigs/agent-sandbox/releases/download/${VERSION}/sandbox-with-extensions.yaml"
          # every CRD in crds/ must appear byte-identical in the upstream release
          for f in helm/mogenius-agent-sandbox/crds/*.yaml; do
            grep -qF -- "$(sed -n '3p' "$f")" /tmp/upstream.yaml || { echo "CRD $f not from $VERSION"; exit 1; }
          done

  # Installs the chart into a kind cluster and waits for a warm sandbox — the
  # same check the local kit does on Docker Desktop.
  install:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - run: |
          set -euo pipefail
          helm install asb helm/mogenius-agent-sandbox -n agent-sandbox-system --create-namespace --wait --timeout 5m
          for _ in $(seq 1 120); do
            ready=$(kubectl -n agent-sandbox get sandboxwarmpool default -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
            [ "${ready:-0}" -ge 1 ] && break
            sleep 5
          done
          kubectl -n agent-sandbox get sandboxwarmpool,sandboxes,pods
          [ "${ready:-0}" -ge 1 ] || { kubectl -n agent-sandbox describe pods; kubectl -n agent-sandbox-system logs deploy/agent-sandbox-controller --tail=100; exit 1; }

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint, install]
    permissions:
      contents: write # chart-releaser pushes the index to gh-pages and creates releases
      pages: write # enabling the Pages site on first run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - uses: azure/setup-helm@v4
      # chart-releaser writes index.yaml to the gh-pages branch and fails with
      # "invalid reference: origin/gh-pages" when it does not exist yet. Create
      # it once as an empty commit (empty tree, no worktree changes) so the
      # first release works without manual setup.
      - name: ensure gh-pages branch exists
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            empty_tree=$(git hash-object -t tree /dev/null)
            commit=$(git commit-tree "$empty_tree" -m "chore: init gh-pages for the Helm repository index")
            git push origin "$commit:refs/heads/gh-pages"
          fi
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
      # The Helm repository URL in charts/agent-sandbox.yaml is the Pages site
      # of this repo. Enable it once (legacy build from gh-pages, root). If the
      # token may not, the release still runs; Pages then needs a click in
      # Settings → Pages.
      - name: ensure GitHub Pages serves gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          code=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$api")
          if [ "$code" = "404" ]; then
            curl -sf -X POST "${auth[@]}" "$api" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' \
              || echo "::warning::Could not enable GitHub Pages automatically. Enable it under Settings → Pages (branch gh-pages, folder /)."
          else
            echo "Pages already configured (HTTP $code)"
          fi
      # Publishes a GitHub Release per changed chart version and maintains
      # index.yaml on the gh-pages branch, i.e. a classic Helm repository at
      # https://<owner>.github.io/<repo>. For helm.mogenius.com use
      # hack/publish-chartmuseum.sh instead.
      - uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          skip_existing: true
          # Keep the .tgz next to index.yaml on gh-pages. Release assets of a
          # private repository need authentication, which `helm repo add` in
          # the operator does not have; the Pages site is reachable anonymously.
          packages_with_index: true
          pages_branch: gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
