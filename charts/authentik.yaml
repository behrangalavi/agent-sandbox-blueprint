apiVersion: v1
kind: HelmBlueprint
metadata:
  id: authentik
  displayName: authentik
  description: Open source identity provider — single sign-on with OpenID Connect, OAuth2, SAML and LDAP, flow-based MFA, self-service and application proxy. Official chart with bundled PostgreSQL for evaluation — set the secret key before installing and connect a managed PostgreSQL for production (see values).
  category: security
  icon: https://goauthentik.io/img/icon.svg
  tags: [sso, oidc, saml, ldap, identity, authentication, security]
spec:
  repository:
    name: authentik
    url: https://charts.goauthentik.io
  chart:
    name: authentik/authentik
    version: "2026.5.6"
  install:
    release: authentik
    namespace: authentik
  values: |
    authentik:
      # REQUIRED — used for cookie signing and unique user IDs.
      # Generate BEFORE the first install (e.g. openssl rand -base64 60 | tr -d '\n')
      # and NEVER change it afterwards, or sessions and tokens break.
      secret_key: "CHANGE-ME-generate-with--openssl-rand-base64-60"
      error_reporting:
        # Anonymous error reporting to authentik — keep off unless wanted.
        enabled: false
      postgresql:
        # Must match postgresql.auth.password below (or your external DB).
        password: "change-me-now"

    server:
      # authentik server (web UI + API). After install, create the admin
      # account (akadmin) via the initial setup flow:
      #   kubectl -n authentik port-forward svc/authentik-server 9000:80
      #   open http://localhost:9000/if/flow/initial-setup/
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      # ingress:
      #   enabled: true
      #   ingressClassName: traefik
      #   hosts:
      #     - authentik.example.com
      #   tls:
      #     - hosts: [authentik.example.com]
      #       secretName: authentik-tls
      # Prometheus metrics (pairs with the Kube Prometheus Stack blueprint):
      # metrics:
      #   enabled: true
      #   serviceMonitor:
      #     enabled: true

    worker:
      # Background worker (outposts, tasks, blueprints) — no Redis needed,
      # authentik queues everything in PostgreSQL.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    # Bundled PostgreSQL — fine for evaluation and small setups. For
    # production use a managed/operated PostgreSQL (e.g. CloudNativePG),
    # set postgresql.enabled: false and point authentik.postgresql.host/
    # user/password at it instead.
    postgresql:
      enabled: true
      auth:
        password: "change-me-now"