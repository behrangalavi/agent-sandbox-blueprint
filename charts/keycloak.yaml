apiVersion: v1
kind: HelmBlueprint
metadata:
  id: keycloak
  displayName: Keycloak
  description: Open source identity and access management — single sign-on with OpenID Connect, OAuth2 and SAML, user federation (LDAP / Active Directory) and social login. Runs the official Keycloak image via the codecentric keycloakx chart. Starts with an embedded H2 database for evaluation — connect a PostgreSQL for production (see values).
  category: security
  icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/keycloak/icon/color/keycloak-icon-color.svg
  tags: [sso, oidc, saml, identity, authentication, security]
spec:
  repository:
    name: codecentric
    url: https://codecentric.github.io/helm-charts
  chart:
    name: codecentric/keycloakx
    version: "7.2.2"
  install:
    release: keycloak
    namespace: keycloak
  values: |
    # Keycloak 26 (quay.io/keycloak/keycloak) in production mode ("start").
    # The chart defaults to proxy.enabled=true / mode=forwarded, so Keycloak
    # accepts plain HTTP behind an ingress or the mogenius port-forward.
    command:
      - "/opt/keycloak/bin/kc.sh"
      - "start"
      - "--http-enabled=true"
      - "--http-port=8080"
      - "--hostname-strict=false"

    # Bootstrap admin for the first start — CHANGE THE PASSWORD before
    # installing (or override the values during install). After the first
    # login create a permanent admin and delete this temporary account.
    extraEnv: |
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: "change-me-now"

    # WITHOUT a database block Keycloak uses an embedded H2 *file* database
    # inside the container — fine for a quick evaluation, but ALL DATA IS
    # LOST when the pod restarts. For real use, point Keycloak at a
    # PostgreSQL (e.g. via a postgres blueprint or managed DB) and prefer
    # existingSecret over an inline password:
    # database:
    #   vendor: postgres
    #   hostname: keycloak-postgresql
    #   port: 5432
    #   database: keycloak
    #   username: keycloak
    #   existingSecret: keycloak-db
    #   existingSecretKey: password

    # Keycloak (JVM) needs headroom — undersized memory limits cause
    # OOM-kills during realm imports and logins.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi

    # The console and all endpoints are served under /auth
    # (chart default http.relativePath) — e.g. http://<host>/auth.
    # Quick access without ingress:
    #   kubectl -n keycloak port-forward svc/keycloak-keycloakx-http 8080:80
    # then open http://localhost:8080/auth
    #
    # ingress:
    #   enabled: true
    #   ingressClassName: traefik
    #   rules:
    #     - host: keycloak.example.com
    #       paths:
    #         - path: /auth
    #           pathType: Prefix
    #   tls:
    #     - hosts: [keycloak.example.com]
    #       secretName: keycloak-tls

    # High availability: scale out and let the pods form an Infinispan
    # cluster via the headless service (requires an external database!).
    # replicas: 3
    # cache:
    #   stack: kubernetes
    # extraEnv: |
    #   ... (admin bootstrap from above) ...
    #   - name: JAVA_OPTS_APPEND
    #     value: >-
    #       -Djgroups.dns.query=keycloak-keycloakx-headless

    # Prometheus metrics are exposed by default (metrics.enabled=true).
    # With the Kube Prometheus Stack blueprint installed, enable scraping:
    # serviceMonitor:
    #   enabled: true