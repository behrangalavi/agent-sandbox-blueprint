apiVersion: v1
kind: HelmBlueprint
metadata:
  id: claude-sandbox
  displayName: Claude Code Sandbox
  description: Isolated agent sandbox with VS Code in the browser (code-server) and Claude Code installed on startup — built entirely from public components, reachable via port-forward on 8080. Requires the Agent Sandbox blueprint to be installed first.
  category: ai
  icon: https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/main/site/assets/icons/color_logo.svg
  tags: [ai, agents, sandbox, claude, code-server]
spec:
  repository:
    name: bedag
    url: https://bedag.github.io/helm-charts
  chart:
    name: bedag/raw
    version: "2.0.2"
  install:
    release: claude-sandbox
    namespace: agent-sandbox-system
  values: |
    # Renders the Sandbox CR below via the generic bedag/raw chart — no custom
    # chart or image required. code-server is the official public image; the
    # Claude Code CLI is installed on container start via the native installer
    # (needs outbound internet access on first boot).
    #
    # Not exposed via Service/Ingress — reach the IDE via port-forward:
    #   mocli port-forward -n agent-sandbox-system -k Pod -w claude-sandbox -p 8080:8080
    resources:
      - apiVersion: agents.x-k8s.io/v1beta1
        kind: Sandbox
        metadata:
          name: claude-sandbox
        spec:
          podTemplate:
            spec:
              containers:
                - name: code-server
                  image: codercom/code-server:latest
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      command -v claude >/dev/null 2>&1 || curl -fsSL https://claude.ai/install.sh | bash
                      export PATH="$HOME/.local/bin:$PATH"
                      exec /usr/bin/entrypoint.sh --bind-addr 0.0.0.0:8080 --auth none /home/coder/project
                  # Set your Anthropic API key to use Claude Code non-interactively, e.g.
                  # env:
                  #   - name: ANTHROPIC_API_KEY
                  #     valueFrom:
                  #       secretKeyRef:
                  #         name: anthropic
                  #         key: api-key
                  ports:
                    - containerPort: 8080
                      name: http
                  resources:
                    requests:
                      cpu: "1"
                      memory: 2Gi
                    limits:
                      cpu: "4"
                      memory: 8Gi