name: image

on:
  pull_request:
    paths: ["images/**", ".github/workflows/image.yaml"]
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/image.yaml"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/sandbox-default

jobs:
  # Builds images/<name>; publishes on pushes to main only. The package must be
  # switched to public once in the GitHub UI (Packages → sandbox-default →
  # Package settings → Change visibility), afterwards clusters pull it without
  # a pull secret.
  sandbox-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version="$(tr -d '[:space:]' < images/sandbox-default/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Sandboxes run on arm64 nodes too (Apple Silicon Docker Desktop, Graviton);
      # a single-platform image fails there with "no match for platform".
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/sandbox-default
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Default sandbox image of the mogenius Agent Sandbox blueprint (code-server + Python)
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ steps.meta.outputs.version }}"
          docker run --rm "$img" python3 --version
          docker run --rm "$img" uv --version
          docker run --rm "$img" code-server --version
          docker run --rm "$img" claude --version
          cid=$(docker run -d "$img")
          for _ in $(seq 1 30); do
            if docker exec "$cid" curl -sf http://127.0.0.1:8080/healthz >/dev/null; then ok=1; break; fi; sleep 2
          done
          docker rm -f "$cid" >/dev/null
          [ "${ok:-0}" = 1 ] || { echo "code-server did not become healthy"; exit 1; }
      - name: summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### sandbox-default ${{ steps.meta.outputs.version }}"
            echo
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Pin this reference as \`sandboxes.profiles.default.image\` in helm/mogenius-agent-sandbox/values.yaml."
          } >> "$GITHUB_STEP_SUMMARY"
