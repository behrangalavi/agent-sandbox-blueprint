{{- /*
One SandboxWarmPool per enabled profile, also with 0 replicas: SandboxClaims
reference the pool, so it has to exist for a profile to be claimable at all.
With replicas > 0 the pool keeps sandboxes pre-warmed so a claim binds in
seconds instead of waiting for a pod to start.
*/ -}}
{{- $root := . }}
{{- range $name, $p := .Values.sandboxes.profiles }}
{{- if $p.enabled }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ $name }}
  namespace: {{ include "mogenius-agent-sandbox.sandboxNamespace" $root }}
  labels:
    {{- include "mogenius-agent-sandbox.labels" $root | nindent 4 }}
    mogenius.io/sandbox-profile: {{ $name }}
spec:
  replicas: {{ int (default 0 (default (dict) $p.warmPool).replicas) }}
  sandboxTemplateRef:
    name: {{ $name }}
  {{- with (default (dict) $p.warmPool).updateStrategy }}
  updateStrategy:
    type: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
