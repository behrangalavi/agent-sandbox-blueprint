blueprints:
  - id: agent-sandbox
    displayName: Agent Sandbox
    description: Kubernetes-native runtime for isolated, stateful AI agent sandboxes — installs the controller with extensions (SandboxTemplate, SandboxClaim, SandboxWarmPool)
    category: ai
    icon: https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/main/site/assets/icons/color_logo.svg
    tags: [ai, agents, sandbox, isolation]

  - id: agent-sandbox-warmpool
    displayName: Agent Sandbox Warm Pool
    description: Keeps a pool of pre-warmed agent sandboxes ready for instant claims — SandboxTemplate and pool size configurable via values (requires Agent Sandbox)
    category: ai
    icon: https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/main/site/assets/icons/color_logo.svg
    tags: [ai, agents, sandbox, warmpool]

  - id: claude-sandbox
    displayName: Claude Code Sandbox
    description: Isolated agent sandbox with VS Code in the browser and Claude Code installed on startup — public components only, port-forward 8080 for the IDE (requires Agent Sandbox)
    category: ai
    icon: https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/main/site/assets/icons/color_logo.svg
    tags: [ai, agents, sandbox, claude, code-server]

  - id: keycloak
    displayName: Keycloak
    description: Open source identity and access management — single sign-on with OpenID Connect, OAuth2 and SAML, user federation (LDAP / Active Directory) and social login, based on the official Keycloak image
    category: security
    icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/keycloak/icon/color/keycloak-icon-color.svg
    tags: [sso, oidc, saml, identity, authentication, security]